<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="cont-1 center">
        <div class="cont-2 center">

            <div class="cont-3 center">

                <div class="cont-4 center">

                    <div class="cont-5 center">
                        <div class="box box-1"></div>
                        <div class="box box-2"></div>
                        <div class="box box-3"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <style>
        .center {
            
            display: flex;
            justify-content: center;
            align-items: center;

            width: 90%;
            height: 90%;
        }
        
        body {
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;
            background-color: pink;
            height: 100vh;
        }

        .cont-1 {
            background-color: green;
        }

        .cont-2 {
            background-color: aqua;
            position: relative;
        }

        .cont-3 {
            background-color: red;
        }

        .cont-4 {
            background-color: blue;
        }

        .cont-5 {
            background-color: blueviolet;
        }

        .box {
            width: 50px;
            height: 50px;
            background-color: black;
        }
        .box-1 {
            top: 0;
            right: 0;
            position: absolute;
        }
        .box-2 {
            right: -51px;
            top: -50px;
            position: absolute;
            background-color: aliceblue;
        }
        .box-3 {
            background-color: rgb(91, 122, 148);
        }
    </style>
</body>

</html>
